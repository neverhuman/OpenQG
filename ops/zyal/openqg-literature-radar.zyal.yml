<<<ZYAL v1:daemon id=openqg-literature-radar>>>
version: v1
intent: daemon
confirm: RUN_FOREVER
job:
  name: openqg-literature-radar
  objective: Scan public literature and write paper cards into research/inbox.
loop:
  policy: forever
  sleep: 1h
stop:
  any:
    - shell:
        command: "test -f research/inbox/.halt"
        timeout: 5s
checkpoint:
  when: after_new_card
permissions:
  git_push: deny
ui:
  mode: gold
<<<END_ZYAL id=openqg-literature-radar>>>
