minimum_score = 85

[policy]
score_target = 85
require_schema_check = true
require_data_verify = true
require_bench_smoke = true
require_zyal_validate = true
require_security = true

[history]
dedupe = "consecutive-equivalent"
max_bytes = 1048576
max_rows = 500

[scan]
# ZYAL/runs/*.zyal are engine-input runbooks for the genome evolution loop
# (read by DEFAULT_RUNBOOK_ROOT="ZYAL/runs"; `imports` is parsed as a string
# array; the keys are the genome DSL's own vocabulary). They are NOT jankurai
# agent-tool definitions, so the HLT-024 agent-tool contract does not apply.
# They are validated by `just zyal-validate` and the genome engine's own tests.
excluded_paths = ["target/", "reports/releases/draft/", "ZYAL/runs/"]

[notes]
do_not_trust_model_claims = true
prefer_artifacts_over_prose = true
