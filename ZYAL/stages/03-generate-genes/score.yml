schema_version: zyal-stage-score.v1
stage_id: 03-generate-genes
rubric:
  artifact_validity: generated gene has machine-readable evidence
  novelty: gene adds a distinct source-backed idea
  source_grounding: source cards are cited by id
  benchmark_safety: proposals only, no protected source mutation
penalties:
  - model claim without artifact evidence
  - uncached research
  - copied benchmark values
