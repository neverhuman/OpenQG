schema_version: zyal-stage.v1
stage_id: 00-atlas
name: Atlas intake
family: standard
track: routing
purpose: Capture the initial genome context and freeze the first evidence bundle.
inputs:
  - runbook
  - prior_generation_summary
outputs:
  - atlas_manifest
required_evidence:
  - run-events.jsonl
  - stage-ledger.jsonl
  - stages/00-atlas/evaluation-events.jsonl
validation_checks:
  - stage_id matches filename
  - required evidence is present and non-empty
  - lineage root has no parent_generation_id
handoff_contract:
  upstream: []
  downstream:
    - stage_id
    - generation_id
    - candidate_id
    - artifact_paths
routing:
  preferred_backend: jnoccio
  route_tier: standard
  route_policy: standard_pool
scoring:
  local: 0.30
  interface: 0.20
  macro: 0.30
  innovation: 0.15
  failure_penalty: 0.05
mutation_op: emit_atlas
notes:
  - Bootstrap the genome state and seed the first lineages.
