schema_version: zyal-stage.v1
stage_id: 05-compatibility
name: Compatibility check
family: hard
track: validation
purpose: Check repaired genes against the interface contract and stage handoff rules.
inputs:
  - repaired_genes
  - handoff_contract
outputs:
  - compatibility_report
required_evidence:
  - run-events.jsonl
  - stage-ledger.jsonl
  - stages/05-compatibility/evaluation-events.jsonl
validation_checks:
  - interface score is reported explicitly
  - contract fields are not missing
  - route tier is top20_pct_only for hard routing
handoff_contract:
  upstream:
    - repaired_genes
  downstream:
    - compatibility_report
    - interface_score
routing:
  preferred_backend: jnoccio
  route_tier: top20_pct_only
  route_policy: hard_only
scoring:
  local: 0.30
  interface: 0.20
  macro: 0.30
  innovation: 0.15
  failure_penalty: 0.05
mutation_op: check_compatibility
notes:
  - Compatibility is a hard gate because it controls downstream assembly.
