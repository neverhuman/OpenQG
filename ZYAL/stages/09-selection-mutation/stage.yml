schema_version: zyal-stage.v1
stage_id: 09-selection-mutation
name: Selection mutation
family: hard
track: mutation
purpose: Select the best surviving lineages and apply the next mutation op.
inputs:
  - failure_slices
  - candidate_genes
outputs:
  - selected_lineages
required_evidence:
  - run-events.jsonl
  - stage-ledger.jsonl
  - stages/09-selection-mutation/evaluation-events.jsonl
validation_checks:
  - selected lineages are acyclic
  - route tier stays in the hard path when needed
  - mutation ops are emitted in the ledger
handoff_contract:
  upstream:
    - failure_slices
    - candidate_genes
  downstream:
    - selected_lineages
    - mutation_op
routing:
  preferred_backend: jnoccio
  route_tier: top20_pct_only
  route_policy: hard_only
scoring:
  local: 0.30
  interface: 0.20
  macro: 0.30
  innovation: 0.15
  failure_penalty: 0.05
mutation_op: select_and_mutate
notes:
  - This stage governs parent selection and mutation pressure.
