schema_version: zyal-stage.v1
stage_id: 08-failure-slicing
name: Failure slicing
family: hard
track: evaluation
purpose: Slice the failure surface into candidate fix hypotheses.
inputs:
  - macro_test_report
  - failure_modes
outputs:
  - failure_slices
required_evidence:
  - run-events.jsonl
  - stage-ledger.jsonl
  - stages/08-failure-slicing/evaluation-events.jsonl
validation_checks:
  - failure slice labels map to evidence
  - route tier uses the hard-route policy
  - emitted artifacts include failure penalties
handoff_contract:
  upstream:
    - macro_test_report
  downstream:
    - failure_slices
    - failure_modes
routing:
  preferred_backend: jnoccio
  route_tier: top20_pct_only
  route_policy: hard_only
scoring:
  local: 0.30
  interface: 0.20
  macro: 0.30
  innovation: 0.15
  failure_penalty: 0.05
mutation_op: slice_failure
notes:
  - This stage should surface the smallest useful failure deltas.
