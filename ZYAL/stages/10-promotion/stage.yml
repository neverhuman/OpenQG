schema_version: zyal-stage.v1
stage_id: 10-promotion
name: Promotion
family: standard
track: promotion
purpose: Promote the strongest lineage into the next generation.
inputs:
  - selected_lineages
  - macro_test_report
outputs:
  - promoted_generation
required_evidence:
  - run-events.jsonl
  - stage-ledger.jsonl
  - stages/10-promotion/evaluation-events.jsonl
validation_checks:
  - promoted generation keeps the strongest score
  - lineage metadata is preserved
  - stage outputs are non-empty
handoff_contract:
  upstream:
    - selected_lineages
    - macro_test_report
  downstream:
    - promoted_generation
    - lineage
routing:
  preferred_backend: jnoccio
  route_tier: standard
  route_policy: standard_pool
scoring:
  local: 0.30
  interface: 0.20
  macro: 0.30
  innovation: 0.15
  failure_penalty: 0.05
mutation_op: promote_lineage
notes:
  - Promotion should keep the best non-regressive lineage.
