schema_version: zyal-stage.v1
stage_id: 03-generate-genes
name: Generate genes
family: standard
track: synthesis
purpose: Generate candidate genes from the decomposed evidence.
inputs:
  - known_gene_slices
  - repair_gene_slices
outputs:
  - candidate_genes
required_evidence:
  - run-events.jsonl
  - stage-ledger.jsonl
  - stages/03-generate-genes/evaluation-events.jsonl
validation_checks:
  - candidate ids are unique per generation
  - emitted genes carry artifact paths
  - local score stays within [0, 1]
handoff_contract:
  upstream:
    - known_gene_slices
    - repair_gene_slices
  downstream:
    - candidate_genes
routing:
  preferred_backend: jnoccio
  route_tier: standard
  route_policy: standard_pool
scoring:
  local: 0.30
  interface: 0.20
  macro: 0.30
  innovation: 0.15
  failure_penalty: 0.05
mutation_op: emit_gene
notes:
  - Keep the emitted candidate set small and deterministic.
