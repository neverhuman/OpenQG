schema_version: zyal-stage-score.v1
stage_id: 00-atlas
rubric:
  artifact_validity: required evidence exists and is non-empty
  source_grounding: context is tied to local or cached source cards
  stage_reusability: atlas bundle can seed later runs without hidden state
  benchmark_safety: no copied target values or fixture leakage
penalties:
  - missing lineage root
  - uncached source claim
  - benchmark value copied into context
