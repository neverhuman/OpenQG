name: jankurai

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@36f1e144e1c8edb0a652766b484448563d8baf46
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo fetch --locked
      - run: cargo install --locked cargo-nextest
      - run: cargo install --locked just
      - run: bash ops/ci/jankurai.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jankurai-evidence
          path: |
            target/jankurai/current-audit.json
            target/jankurai/current-audit.md
            target/openqg/contracts/*.json
            target/openqg/zyal/jekko-preview.jsonl
            target/openqg/bench-smoke/scorecard.json
            target/openqg/data/locks/data-lock.json
            target/jankurai/accepted-baseline.json
            target/jankurai/accepted-baseline.md
            target/jankurai/repo-score.json
            target/jankurai/repo-score.md
            target/jankurai/security/evidence.json
            target/jankurai/security/lane-status.txt
            target/jankurai/security/lane.log
            target/jankurai/security/*.log
            reports/releases/draft/*
